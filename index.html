function fmtWeekRange(weekStart) {
  const start = new Date(weekStart + "T12:00:00");
  const end = new Date(start);
  end.setDate(start.getDate() + 6);
  const sameMonth = start.getMonth() === end.getMonth();
  const startStr = start.toLocaleDateString("en-US", { month: "short", day: "numeric" });
  const endStr = sameMonth
    ? end.toLocaleDateString("en-US", { day: "numeric" })
    : end.toLocaleDateString("en-US", { month: "short", day: "numeric" });
  return startStr + "\u2013" + endStr + ", " + end.getFullYear();
}

function getDefaultWeekStart() {
  const today = new Date();
  today.setHours(0, 0, 0, 0);
  for (const w of PLAN) {
    const start = new Date(w.weekStart + "T00:00:00");
    const end = new Date(start);
    end.setDate(start.getDate() + 6);
    if (today >= start && today <= end) return w.weekStart;
  }
  const started = PLAN.filter((w) => new Date(w.weekStart + "T00:00:00") <= today);
  if (started.length) return started[started.length - 1].weekStart;
  return PLAN[0].weekStart;
}

function getCurrentWeekVA(planVsActualByWeek) {
  const defaultStart = getDefaultWeekStart();
  return planVsActualByWeek.find((w) => w.weekStart === defaultStart) || planVsActualByWeek[planVsActualByWeek.length - 1];
}

function fmtPace(sec) {
  if (sec == null || !isFinite(sec)) return "\u2014";
  const m = Math.floor(sec / 60);
  const s = Math.round(sec % 60);
  return m + ":" + String(s).padStart(2, "0");
}

function fmtDuration(sec) {
  const m = Math.floor(sec / 60);
  const s = Math.round(sec % 60);
  return m + ":" + String(s).padStart(2, "0");
}

function niceScale(values, step, includeZero = false) {
  const nums = values.filter((v) => v != null && isFinite(v));
  if (!nums.length) return { domain: [0, step], ticks: [0, step] };
  let min = Math.floor(Math.min(...nums) / step) * step;
  let max = Math.ceil(Math.max(...nums) / step) * step;
  if (includeZero) min = Math.min(0, min);
  if (max === min) max += step;
  const ticks = [];
  for (let value = min; value <= max + step / 100; value += step) {
    ticks.push(Math.round(value * 1000) / 1000);
  }
  return { domain: [min, max], ticks };
}

function regularPaceScale(values, targetIntervals = 4) {
  const paces = values.filter((v) => v != null && isFinite(v) && v > 0);
  if (!paces.length) return { domain: [-720, -600], ticks: [-720, -600] };
  const minPace = Math.min(...paces);
  const maxPace = Math.max(...paces);
  const rawStep = Math.max(1, (maxPace - minPace) / targetIntervals);
  const allowedSteps = [30, 60, 120, 300, 600, 900, 1200, 1800, 3600, 7200];
  const step = allowedSteps.find((candidate) => candidate >= rawStep) || allowedSteps[allowedSteps.length - 1];
  const start = Math.floor(minPace / 60) * 60;
  const end = start + Math.max(1, Math.ceil((maxPace - start) / step)) * step;
  const paceTicks = [];
  for (let value = start; value <= end + 0.001; value += step) paceTicks.push(value);
  return {
    domain: [-end, -start],
    ticks: paceTicks.slice().reverse().map((value) => -value),
  };
}

function displayWorkoutType(type) {

function getScheduleWorkoutDisplay(planned) {
  const raw = planned && planned.type ? planned.type : "—";
  if (raw === "—") return { main: raw, detail: "" };
  if (/^Long slow$/i.test(raw)) return { main: "Long", detail: "" };
  const parenMatch = raw.match(/^(.*?)\s*\((.*)\)$/);
  if (parenMatch) {
    let main = parenMatch[1].trim();
    let detail = parenMatch[2].trim();
    if (/^Hill workout$/i.test(main)) main = "Hills";
    detail = detail.replace(/warmup/gi, "wu").replace(/cooldown/gi, "cd").replace(/ repeats/gi, "").replace(/\s*\+\s*/g, " / ");
    return { main, detail };
  }
  if (raw.includes(" + ")) {
    const [main, ...rest] = raw.split(" + ");
    return { main, detail: "+" + rest.join(" + ") };
  }
  return { main: raw, detail: "" };
}

function splitWorkoutDetail(detail) {
  if (!detail) return { warmupCooldown: "", intervals: "" };
  const parts = detail.split("/").map((part) => part.trim()).filter(Boolean);
  const warmupCooldown = parts.filter((part) => /\b(?:wu|cd)\b/i.test(part));
  const intervals = parts.filter((part) => !/\b(?:wu|cd)\b/i.test(part));
  return {
    warmupCooldown: warmupCooldown.join(" / "),
    intervals: intervals.join(" / "),
  };
}

function runForDate(date) {

function projectRoute(route, size) {
  if (!route || route.length === 0) return "";
  const lats = route.map((p) => p[0]);
  const lons = route.map((p) => p[1]);
  const minLat = Math.min(...lats), maxLat = Math.max(...lats);
  const minLon = Math.min(...lons), maxLon = Math.max(...lons);
  const avgLat = (minLat + maxLat) / 2;
  const cosLat = Math.cos((avgLat * Math.PI) / 180);
  const w = (maxLon - minLon) * cosLat;
  const h = maxLat - minLat;
  const span = Math.max(w, h, 0.0001);
  const pad = size * 0.12;
  const scale = (size - pad * 2) / span;
  const offX = (size - w * scale) / 2;
  const offY = (size - h * scale) / 2;
  return route
    .map((p) => {
      const x = (p[1] - minLon) * cosLat * scale + offX;
      const y = size - ((p[0] - minLat) * scale + offY);
      return x.toFixed(1) + "," + y.toFixed(1);
    })
    .join(" ");
}

  const points = routeShape

}

function CalendarMonth({ monthDate, setMonthDate, onDayClick }) {
  const year = monthDate.getFullYear();
  const month = monthDate.getMonth();
  const first = new Date(year, month, 1);
  const startDow = (first.getDay() + 6) % 7; // Monday = 0
  const daysInMonth = new Date(year, month + 1, 0).getDate();
  const cells = [];
  for (let i = 0; i < startDow; i++) cells.push(null);
  for (let d = 1; d <= daysInMonth; d++) cells.push(d);
  while (cells.length % 7 !== 0) cells.push(null);

  const monthLabel = monthDate.toLocaleDateString("en-US", { month: "long", year: "numeric" });

  function dayISO(d) {
    return year + "-" + String(month + 1).padStart(2, "0") + "-" + String(d).padStart(2, "0");
  }

  return (
    <div>
      <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: 10 }}>
        <button onClick={() => setMonthDate(new Date(year, month - 1, 1))} style={{ background: "none", border: "none", cursor: "pointer", padding: 4, color: "var(--text-secondary)" }}>
          <i className="ti ti-chevron-left" style={{ fontSize: 18 }}></i>
        </button>
        <p style={{ fontSize: 13, fontWeight: 500, margin: 0 }}>{monthLabel}</p>
        <button onClick={() => setMonthDate(new Date(year, month + 1, 1))} style={{ background: "none", border: "none", cursor: "pointer", padding: 4, color: "var(--text-secondary)" }}>
          <i className="ti ti-chevron-right" style={{ fontSize: 18 }}></i>
        </button>
      </div>
      <div style={{ display: "grid", gridTemplateColumns: "repeat(7, 1fr)", gap: 4, marginBottom: 4 }}>
        {["M", "T", "W", "T", "F", "S", "S"].map((d, i) => (
          <div key={i} style={{ textAlign: "center", fontSize: 10, color: "var(--text-secondary)", fontWeight: 500 }}>{d}</div>
        ))}
      </div>
      <div style={{ display: "grid", gridTemplateColumns: "repeat(7, 1fr)", gap: 4 }}>
        {cells.map((d, i) => {
          if (d === null) return <div key={i} />;
          const iso = dayISO(d);
          const run = runForDate(iso);
          const c = run ? TYPE_COLOR[run.type] || TYPE_COLOR.Easy : null;
          return (
            <div
              key={i}
              onClick={run ? () => onDayClick(iso) : undefined}
              title={run ? run.type + ": " + run.distance_mi + " mi (tap to view)" : ""}

                aspectRatio: "1",

                display: "flex",
                alignItems: "center",
                justifyContent: "center",
                fontSize: 11,
                fontWeight: c ? 600 : 400,
                cursor: run ? "pointer" : "default",
              }}
            >
              {d}
            </div>
          );
        })}
      </div>
      <div style={{ display: "flex", gap: 12, flexWrap: "wrap", marginTop: 12, fontSize: 11, color: "var(--text-secondary)" }}>
        {Object.entries(TYPE_COLOR).filter(([k]) => k !== "Rest").map(([k, v]) => (

            <YAxis yAxisId="pace" orientation="left" domain={detailPaceScale.domain} ticks={detailPaceScale.ticks} interval={0} allowDataOverflow tick={{ fontSize: 9, fill: "#77807A" }} axisLine={false} tickLine={false} width={40} tickFormatter={(v) => fmtPace(-v)} />
            <Tooltip
              cursor={{ fill: "transparent" }}
              contentStyle={{ background: "var(--surface-2)", border: "0.5px solid var(--border)", borderRadius: 8, fontSize: 12 }}
              formatter={(value, name, item) => {
                const key = item && item.dataKey;
                if (key === "elev_ft") return [Math.round(value) + " ft", "Elevation"];
                if (key === "paceNeg") return [fmtPace(-value) + "/mi", "Pace"];
                if (key === "hr") return [value + " bpm", "HR"];
                if (key === "cad") return [value + " spm", "Cadence"];
                return [value, name];
              }}
              labelFormatter={(v) => v.toFixed(2) + " mi"}
            />
                        <Area name="Elevation" yAxisId="elev" type="monotone" dataKey="elev_ft" stroke="#BDD1C5" fill="#BDD1C5" fillOpacity={0.25} strokeWidth={1.2} hide={!!hiddenSeries.elev_ft} />
            <Line name="Pace" yAxisId="pace" type="monotone" dataKey="paceNeg" stroke="#9DAAA2" strokeWidth={1.5} dot={false} connectNulls hide={!!hiddenSeries.paceNeg} />
            <Line name="HR" yAxisId="hr" type="monotone" dataKey="hr" stroke="#A26360" strokeWidth={1.5} dot={false} connectNulls hide={!!hiddenSeries.hr} />
            <Line name="Cadence" yAxisId="cad" dataKey="cad" stroke={TYPE_COLOR.Tempo.solid} strokeOpacity={0} dot={{ r: 1.6, fill: TYPE_COLOR.Tempo.solid, stroke: TYPE_COLOR.Tempo.solid }} activeDot={{ r: 3, fill: TYPE_COLOR.Tempo.solid, stroke: TYPE_COLOR.Tempo.solid }} isAnimationActive={false} connectNulls hide={!!hiddenSeries.cad} />
          </ComposedChart>
        </ResponsiveContainer>
      </div>
      <div style={{ display: "flex", gap: 14, fontSize: 11, color: "var(--text-secondary)", marginTop: 4, flexWrap: "wrap" }}>
        {[{ key: "elev_ft", label: "Elevation", swatch: { background: "#BDD1C5", opacity: 0.5, borderRadius: 2 } }, { key: "paceNeg", label: "Pace", swatch: { background: "#9DAAA2", borderRadius: 2 } }, { key: "hr", label: "Avg HR", swatch: { background: "#A26360", borderRadius: 2 } }, { key: "cad", label: "Cadence", swatch: { background: TYPE_COLOR.Tempo.solid, borderRadius: "50%" } }].map((item) => (
          <span key={item.key} onClick={() => toggleSeries(item.key)} style={{ cursor: "pointer", opacity: hiddenSeries[item.key] ? 0.45 : 1, textDecoration: hiddenSeries[item.key] ? "line-through" : "none" }}>
            <span style={{ display: "inline-block", width: 9, height: 9, marginRight: 4, ...item.swatch }}></span>{item.label}
          </span>
        ))}
      </div>

      {r.type === "Hill" && r.hill_reps && (
        <div style={{ marginTop: 14 }}>
          <p style={{ fontSize: 11, color: "var(--text-secondary)", margin: "0 0 6px" }}>Hill repeats (from watch laps; rep 1's distance/time were adjusted since the lap button was pressed late)</p>
          <div style={{ overflowX: "auto" }}>
            <table style={{ width: "100%", borderCollapse: "collapse", fontSize: 12 }}>
              <thead>
                <tr style={{ borderBottom: "0.5px solid var(--border)" }}>
                  <th style={{ textAlign: "center", padding: "6px 8px", color: "var(--text-secondary)", fontWeight: 500 }}>Rep</th>
                  <th style={{ textAlign: "center", padding: "6px 8px", color: "var(--text-secondary)", fontWeight: 500 }}>Distance</th>
                  <th style={{ textAlign: "center", padding: "6px 8px", color: "var(--text-secondary)", fontWeight: 500 }}>Time</th>
                  <th style={{ textAlign: "center", padding: "6px 8px", color: "var(--text-secondary)", fontWeight: 500 }}>Pace</th>
                  <th style={{ textAlign: "center", padding: "6px 8px", color: "var(--text-secondary)", fontWeight: 500 }}>Avg HR</th>
                  <th style={{ textAlign: "center", padding: "6px 8px", color: "var(--text-secondary)", fontWeight: 500 }}>Elev gain</th>
                </tr>
              </thead>
              <tbody>
                {r.hill_reps.map((rep) => (
                  <tr key={rep.rep} style={{ borderBottom: "0.5px solid var(--border)" }}>
                    <td style={{ padding: "6px 8px", textAlign: "center" }}>{rep.rep}{rep.rep === 1 ? " *" : ""}</td>
                    <td style={{ padding: "6px 8px", textAlign: "center" }}>{rep.distance_mi} mi</td>
                    <td style={{ padding: "6px 8px", textAlign: "center" }}>{Math.round(rep.time_s)}s</td>
                    <td style={{ padding: "6px 8px", textAlign: "center" }}>{fmtPace(rep.pace_sec_per_mi)}/mi</td>
                    <td style={{ padding: "6px 8px", textAlign: "center" }}>{rep.avg_hr}</td>
                    <td style={{ padding: "6px 8px", textAlign: "center" }}>{rep.elev_gain_ft} ft</td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        </div>
      )}

      <button
        onClick={onToggleExpand}
        style={{ marginTop: 12, fontSize: 12, color: "var(--text-secondary)", background: "var(--surface-2)", border: "none", borderRadius: 8, padding: "6px 10px", cursor: "pointer", display: "flex", alignItems: "center", gap: 4 }}
      >
        <i className={"ti " + (expanded ? "ti-chevron-up" : "ti-chevron-down")} style={{ fontSize: 14 }}></i>
        {expanded ? "Hide" : "Show"} detailed charts
      </button>

      {expanded && (
        <div style={{ marginTop: 14, display: "flex", flexDirection: "column", gap: 16 }}>
          <div>
            <p style={{ fontSize: 11, color: "var(--text-secondary)", margin: "0 0 4px" }}>Lap average pace</p>
            <div style={{ height: 100 }}>
              <ResponsiveContainer width="100%" height="100%">
                <AreaChart data={r.splits.map((s) => ({ ...s, paceNeg: s.pace != null ? -s.pace : null }))} margin={{ top: 10, right: 4, left: 0, bottom: 0 }}>
                  <XAxis dataKey="mile" tickFormatter={(v) => "Mi " + v} tick={{ fontSize: 10, fill: "var(--text-secondary)" }} axisLine={{ stroke: "var(--border)" }} tickLine={false} />
                  <YAxis domain={lapPaceScale.domain} ticks={lapPaceScale.ticks} interval={0} tickFormatter={(v) => fmtPace(-v)} tick={{ fontSize: 10, fill: "var(--text-secondary)" }} axisLine={false} tickLine={false} width={38} />
                  <Tooltip contentStyle={{ background: "var(--surface-2)", border: "0.5px solid var(--border)", borderRadius: 8, fontSize: 12 }} formatter={(value, _, item) => [fmtPace(-value) + "/mi" + (item.payload.partial ? " (extrapolated)" : ""), "Pace"]} labelFormatter={(v) => "Mile " + v} />
                  <Area type="step" dataKey="paceNeg" stroke="#77807A" strokeWidth={1.5} fill="#9DAAA2" fillOpacity={0.75} baseValue="dataMin" />
                </AreaChart>
              </ResponsiveContainer>
            </div>
          </div>

          <div>
            <p style={{ fontSize: 11, color: "var(--text-secondary)", margin: "0 0 10px" }}>Time in heart rate zones</p>
            {r.hr_zone_time.map((z) => (
              <div key={z.zone} style={{ marginBottom: 16 }}>
                <div style={{ display: "flex", justifyContent: "space-between", alignItems: "baseline", marginBottom: 5 }}>
                  <span style={{ fontSize: 13, fontWeight: 500 }}>{z.zone} <span style={{ fontWeight: 400, color: "var(--text-secondary)", fontSize: 11 }}>{ZONE_RANGE_LABEL[z.zone]}</span></span>
                  <span style={{ fontSize: 13, fontWeight: 600 }}>{Math.floor(z.seconds / 60)}:{String(z.seconds % 60).padStart(2, "0")} <span style={{ fontWeight: 400, color: "var(--text-secondary)", fontSize: 12 }}>&middot; {z.pct}%</span></span>
                </div>
                <div style={{ width: "100%", height: 10, background: "var(--surface-2)", borderRadius: 5, overflow: "hidden" }}>
                  <div style={{ width: z.pct + "%", height: "100%", background: ZONE_COLOR[z.zone], borderRadius: 5 }} />
                </div>
              </div>
            ))}
          </div>

          {r.type !== "Hill" && (
            <div>
              <p style={{ fontSize: 11, color: "var(--text-secondary)", margin: "0 0 6px" }}>Mile splits (from watch laps)</p>
              <div style={{ overflowX: "auto" }}>
                <table style={{ width: "100%", borderCollapse: "collapse", fontSize: 12 }}>
                  <thead>
                    <tr style={{ borderBottom: "0.5px solid var(--border)" }}>
                      <th style={{ textAlign: "center", padding: "6px 8px", color: "var(--text-secondary)", fontWeight: 500 }}>Mi</th>
                      <th style={{ textAlign: "center", padding: "6px 8px", color: "var(--text-secondary)", fontWeight: 500 }}>Pace</th>
                      <th style={{ textAlign: "center", padding: "6px 8px", color: "var(--text-secondary)", fontWeight: 500 }}>Distance</th>
                      <th style={{ textAlign: "center", padding: "6px 8px", color: "var(--text-secondary)", fontWeight: 500 }}>HR</th>
                      <th style={{ textAlign: "center", padding: "6px 8px", color: "var(--text-secondary)", fontWeight: 500 }}>Elevation</th>
                      <th style={{ textAlign: "center", padding: "6px 8px", color: "var(--text-secondary)", fontWeight: 500 }}>Cadence</th>
                      <th style={{ textAlign: "center", padding: "6px 8px", color: "var(--text-secondary)", fontWeight: 500 }}>Temp</th>
                    </tr>
                  </thead>
                  <tbody>
                    {(() => {
                      const paces = r.splits.map((s) => s.pace);
                      const minPace = Math.min(...paces);
                      const maxPace = Math.max(...paces);
                      return r.splits.map((s) => {
                        const barPct = maxPace > minPace ? 100 * (1 - (s.pace - minPace) / (maxPace - minPace)) : 100;
                        const barWidth = Math.max(12, barPct);
                        return (
                          <tr key={s.mile} style={{ borderBottom: "0.5px solid var(--border)" }}>
                            <td style={{ padding: "6px 8px", textAlign: "center" }}>{s.mile}{s.partial ? " *" : ""}</td>
                            <td style={{ padding: "6px 8px" }}>
                              <div style={{ display: "flex", alignItems: "center", justifyContent: "center", gap: 8 }}>
                                <span style={{ minWidth: 44, textAlign: "center" }}>{fmtPace(s.pace)}</span>
                                <div style={{ flex: 1, minWidth: 40, maxWidth: 90, height: 8, background: "var(--surface-2)", borderRadius: 4, overflow: "hidden" }}>
                                  <div style={{ width: barWidth + "%", height: "100%", background: "#9DAAA2", borderRadius: 4 }} />
                                </div>
                              </div>
                            </td>
                            <td style={{ padding: "6px 8px", textAlign: "center" }}>{s.partial ? s.partial_distance_mi : "1.00"} mi</td>
                            <td style={{ padding: "6px 8px", textAlign: "center" }}>{s.avg_hr ?? "\u2014"}</td>
                            <td style={{ padding: "6px 8px", textAlign: "center" }}>{s.elev_net_ft != null ? (s.elev_net_ft > 0 ? "+" : "") + s.elev_net_ft + " ft" : "\u2014"}</td>
                            <td style={{ padding: "6px 8px", textAlign: "center" }}>{s.avg_cadence ?? "\u2014"}</td>
                            <td style={{ padding: "6px 8px", textAlign: "center" }}>{r.avg_temp_c != null ? cToF(r.avg_temp_c) + "\u00b0F" : "\u2014"}</td>
                          </tr>
                        );
                      });
                    })()}
                  </tbody>
                </table>
                {r.splits.some((s) => s.partial) && (
                  <p style={{ fontSize: 10, color: "var(--text-secondary)", margin: "6px 0 0" }}>* partial mile, pace extrapolated to a per-mile-equivalent</p>
                )}
              </div>
            </div>
          )}
        </div>
      )}
    </div>
  );
}

function MileageTrendChart({ data, height = 180 }) {
  const mileageScale = niceScale(data.flatMap((row) => [row.planned, row.actual]), 5, true);
  const MileageTooltip = ({ active, payload, label }) => {
    if (!active || !payload || !payload.length) return null;
    const row = payload[0].payload;
    return (
      <div style={{ background: "var(--surface-2)", border: "0.5px solid var(--border)", borderRadius: 8, fontSize: 13, padding: "8px 10px" }}>
        <div style={{ fontWeight: 500, marginBottom: 4 }}>{label}</div>
        <div style={{ color: PLANNED_COLOR }}><span style={{ display: "inline-block", width: 8, height: 8, border: "2px dashed " + PLANNED_COLOR, borderRadius: 2, marginRight: 5 }}></span>Goal: {row.planned} mi</div>
        <div style={{ color: ACTUAL_COLOR }}><span style={{ display: "inline-block", width: 8, height: 8, background: ACTUAL_COLOR, borderRadius: 2, marginRight: 5 }}></span>Actual: {row.actual} mi</div>
      </div>
    );
  };
  return (
    <React.Fragment>
      <div style={{ display: "flex", gap: 14, fontSize: 11, color: "var(--text-secondary)", marginBottom: 6 }}>
        <span><span style={{ display: "inline-block", width: 10, height: 10, background: ACTUAL_COLOR, borderRadius: 2, marginRight: 4 }}></span>Actual</span>
        <span><span style={{ display: "inline-block", width: 10, height: 10, border: "2px dashed " + PLANNED_COLOR, borderRadius: 2, marginRight: 4 }}></span>Goal</span>
      </div>
      <div style={{ height }}>
        <ResponsiveContainer width="100%" height="100%">
          <BarChart data={data} margin={{ top: 4, right: 8, left: 0, bottom: 0 }} barGap={-48}>
            <CartesianGrid strokeDasharray="3 3" stroke="var(--border)" vertical={false} />
            <XAxis dataKey="weekLabel" tick={{ fontSize: 12, fill: "var(--text-secondary)" }} axisLine={{ stroke: "var(--border)" }} tickLine={false} />
            <YAxis domain={mileageScale.domain} ticks={mileageScale.ticks} interval={0} tick={{ fontSize: 12, fill: "var(--text-secondary)" }} axisLine={false} tickLine={false} width={36} />
            <Tooltip shared={true} cursor={{ fill: "transparent" }} content={<MileageTooltip />} />
            <Bar name="Actual" dataKey="actual" fill={ACTUAL_COLOR} barSize={48} radius={[4, 4, 0, 0]} isAnimationActive={false} />
            <Bar name="Goal" dataKey="planned" fill={PLANNED_COLOR} fillOpacity={0.01} stroke={PLANNED_COLOR} strokeWidth={2} strokeDasharray="5 4" barSize={48} radius={[4, 4, 0, 0]} isAnimationActive={false} />
          </BarChart>
        </ResponsiveContainer>
      </div>
    </React.Fragment>
  );
}

function RunningDashboard() {
  const [tab, setTab] = useState("overview");
  const [selectedWeek, setSelectedWeek] = useState(getDefaultWeekStart());
  const lastRunDate = RUNS[RUNS.length - 1].date;
  const [monthDate, setMonthDate] = useState(new Date(parseInt(lastRunDate.slice(0,4)), parseInt(lastRunDate.slice(5,7))-1, 1));

  const week = useMemo(() => PLAN.find((w) => w.weekStart === selectedWeek), [selectedWeek]);
  const [expanded, setExpanded] = useState({});
  const [activeRunDate, setActiveRunDate] = useState(null);
  const [modalExpanded, setModalExpanded] = useState(false);
  const [runFilter, setRunFilter] = useState("All");
  const [dateFrom, setDateFrom] = useState("");
  const [dateTo, setDateTo] = useState("");
  const runTypes = useMemo(() => ["All", ...Array.from(new Set(RUNS.map((r) => r.type)))], []);

  const shoeMileage = useMemo(() => {
    const map = {};
    RUNS.forEach((r) => {
      const shoe = r.shoe || "Unknown";
      if (!map[shoe]) map[shoe] = { miles: 0, runs: 0 };
      map[shoe].miles += r.distance_mi;
      map[shoe].runs += 1;
    });
    (typeof SHOE_ADJUSTMENTS !== "undefined" ? SHOE_ADJUSTMENTS : []).forEach((adj) => {
      if (!map[adj.shoe]) map[adj.shoe] = { miles: 0, runs: 0 };
      map[adj.shoe].miles += adj.miles;
    });
    return Object.entries(map).map(([shoe, v]) => ({ shoe, miles: Math.round(v.miles * 100) / 100, runs: (SHOE_ACTIVITY_BASELINE[shoe] ?? 0) + v.runs, maxMiles: shoe === "Sunrise Evo SL" ? 600 : 400 }));
  }, []);

  const totalMiles = useMemo(() => RUNS.reduce((a, r) => a + r.distance_mi, 0), []);
  const totalTime = useMemo(() => RUNS.reduce((a, r) => a + r.duration_s, 0), []);
  const avgHrOverall = useMemo(() => {
    const vals = RUNS.map((r) => r.avg_hr);
    return Math.round(vals.reduce((a, b) => a + b, 0) / vals.length);
  }, []);
  const avgCadenceOverall = useMemo(() => {
    const vals = RUNS.map((r) => r.avg_cadence).filter((v) => v != null);
    return Math.round(vals.reduce((a, b) => a + b, 0) / vals.length);
  }, []);
  const weeksToRace = useMemo(() => {
    const now = new Date(); now.setHours(0,0,0,0);
    const race = new Date("2026-11-29T00:00:00");
    const days = Math.max(0, Math.ceil((race - now) / 86400000));
    return { weeks: Math.floor(days / 7), days: days % 7 };
  }, []);
  const avgFullWeekMileage = useMemo(() => {
    const today = new Date(); today.setHours(0,0,0,0);
    const complete = PLAN.filter((w) => { const end = new Date(w.weekStart + "T00:00:00"); end.setDate(end.getDate()+7); return end <= today; });
    if (!complete.length) return 0;
    const totals = complete.map((w) => w.days.reduce((a,d) => { const r=runForDate(d.date); return a + (r ? r.distance_mi : 0); }, 0));
    return totals.reduce((a,b)=>a+b,0) / totals.length;
  }, []);

  const typeBreakdown = useMemo(() => {
    const map = {};
    RUNS.forEach((r) => { map[r.type] = (map[r.type] || 0) + r.distance_mi; });
    return Object.entries(map).map(([type, miles]) => ({
      type, miles: Math.round(miles * 100) / 100, color: (TYPE_COLOR[type] || TYPE_COLOR.Easy).solid,
    }));
  }, []);

  const planVsActualByWeek = useMemo(() => {
    return PLAN.map((w) => {
      const plannedTotal = w.days.reduce((a, d) => a + (d.planned ? d.planned.distance : 0), 0);
      const actualTotal = w.days.reduce((a, d) => { const r = runForDate(d.date); return a + (r ? r.distance_mi : 0); }, 0);
      return { weekLabel: w.weekLabel, weekStart: w.weekStart, planned: Math.round(plannedTotal * 100) / 100, actual: Math.round(actualTotal * 100) / 100 };
    });
  }, []);

  const trendsByType = useMemo(() => {
    const map = {};
    RUNS.forEach((r) => {
      if (!map[r.type]) map[r.type] = [];
      const isHill = r.type === "Hill" && r.repeat_avg_pace_sec_per_mi;
      map[r.type].push({
        date: r.date,
        dateLabel: fmtDateShort(r.date),
        pace: isHill ? r.repeat_avg_pace_sec_per_mi : r.duration_s / r.distance_mi,
        hr: isHill ? r.repeat_avg_hr : r.avg_hr,
        distance: r.distance_mi,
        repLength: isHill ? r.repeat_avg_distance_mi : null,
        repTime: isHill ? r.repeat_avg_time_s : null,
        repElev: isHill ? r.repeat_avg_elev_gain_ft : null,
        repCount: isHill ? r.repeat_count : null,
      });
    });
    Object.values(map).forEach((arr) => arr.sort((a, b) => (a.date > b.date ? 1 : -1)));
    return map;
  }, []);

  const tabs = [
    { id: "overview", label: "Overview", icon: "ti-layout-dashboard" },
    { id: "splits", label: "Splits", icon: "ti-chart-bar" },
    { id: "weekly", label: "Schedule", icon: "ti-calendar-stats" },
    { id: "trends", label: "Trends", icon: "ti-trending-up" },
    { id: "gear", label: "Gear", icon: "ti-shoe" },
  ];

  return (
    <div style={{ fontFamily: "var(--font-sans)" }}>
      <style>{RESPONSIVE_CSS}</style>
      <h2 className="sr-only" style={{ position: "absolute", width: 1, height: 1, overflow: "hidden" }}>
        Running training dashboard showing calendar, per-run splits, elevation, cadence, heart rate, schedule, and pace/HR trends by run type.
      </h2>

      <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit, minmax(150px, 1fr))", gap: 12, marginBottom: 20 }}>
        <KpiCard gradient={KPI_GRADIENTS.race} icon="ti-flag" label="Weeks to Race" value={weeksToRace.weeks + "w " + weeksToRace.days + "d"} sub="Sun, Nov 29" />
        <KpiCard gradient={KPI_GRADIENTS.mileage} icon="ti-chart-bar" label="Weekly Mileage" value={avgFullWeekMileage.toFixed(1) + " mi"} sub="average of full weeks" />
        <KpiCard gradient={KPI_GRADIENTS.cadence} icon="ti-activity" label="Cadence (avg.)" value={avgCadenceOverall + " spm"} sub="across all runs" />
        <KpiCard gradient={KPI_GRADIENTS.distance} icon="ti-route" label="Total Distance" value={totalMiles.toFixed(2) + " mi"} sub={RUNS.length + " runs logged"} />
      </div>

      <div style={{ display: "flex", gap: 4, borderBottom: "0.5px solid var(--border)", marginBottom: 20, flexWrap: "wrap" }}>
        {tabs.map((t) => (
          <button
            key={t.id}
            onClick={() => {
              if (t.id !== tab) {
                setExpanded({});
                setModalExpanded(false);
                setActiveRunDate(null);
              }
              setTab(t.id);
            }}
            style={{
              background: "none", border: "none",
              borderBottom: tab === t.id ? "2px solid var(--text-primary)" : "2px solid transparent",
              padding: "8px 14px", fontSize: 14, fontWeight: tab === t.id ? 500 : 400,
              color: tab === t.id ? "var(--text-primary)" : "var(--text-secondary)",
              cursor: "pointer", display: "flex", alignItems: "center", gap: 6,
            }}
          >
            <i className={"ti " + t.icon} style={{ fontSize: 16 }} aria-hidden="true"></i>
            {t.label}
          </button>
        ))}
      </div>

      {tab === "overview" && (
        <div>
          <div className="rd-two-col" style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 16, marginBottom: 16 }}>
            <div style={{ background: "var(--surface-1)", border: "1px solid var(--border)", borderRadius: 16, padding: "1rem 1.2rem" }}>
              <p style={{ fontSize: 13, fontWeight: 500, color: "var(--text-secondary)", margin: "0 0 4px" }}>Run calendar</p>
              <CalendarMonth monthDate={monthDate} setMonthDate={setMonthDate} onDayClick={(d) => { setModalExpanded(false); setActiveRunDate(d); }} />
            </div>

            <div style={{ display: "flex", flexDirection: "column", gap: 16 }}>
              <div style={{ background: "var(--surface-1)", border: "1px solid var(--border)", borderRadius: 16, padding: "1rem 1.2rem" }}>
                <p style={{ fontSize: 13, fontWeight: 500, color: "var(--text-secondary)", margin: "0 0 12px" }}>Miles by run type</p>
                <div className="rd-donut-row" style={{ height: 140, display: "flex", alignItems: "center" }}>
                  <ResponsiveContainer width="55%" height="100%">
                    <PieChart>
                      <Pie data={typeBreakdown} dataKey="miles" nameKey="type" innerRadius={35} outerRadius={58} paddingAngle={3} strokeWidth={0}>
                        {typeBreakdown.map((entry, i) => (<Cell key={i} fill={entry.color} />))}
                      </Pie>
                      <Tooltip contentStyle={{ background: "var(--surface-2)", border: "0.5px solid var(--border)", borderRadius: 8, fontSize: 13 }} formatter={(value, name) => [value + " mi", name]} />
                    </PieChart>
                  </ResponsiveContainer>
                  <div style={{ display: "flex", flexDirection: "column", gap: 6 }}>
                    {typeBreakdown.map((t, i) => (
                      <div key={i} style={{ display: "flex", alignItems: "center", gap: 8, fontSize: 12 }}>
                        <span style={{ width: 9, height: 9, borderRadius: "50%", background: t.color, display: "inline-block" }} />
                        <span style={{ color: "var(--text-secondary)" }}>{displayWorkoutType(t.type)}</span>
                        <span style={{ fontWeight: 500 }}>{t.miles} mi</span>
                      </div>
                    ))}
                  </div>
                </div>
              </div>

              <div style={{ background: "var(--surface-1)", border: "1px solid var(--border)", borderRadius: 16, padding: "1rem 1.2rem" }}>
                <p style={{ fontSize: 13, fontWeight: 500, color: "var(--text-secondary)", margin: "0 0 12px" }}>This week</p>
                <p style={{ fontSize: 28, fontWeight: 700, margin: "0 0 2px", letterSpacing: -0.5 }}>
                  {getCurrentWeekVA(planVsActualByWeek).actual} / {getCurrentWeekVA(planVsActualByWeek).planned} mi
                </p>
                <p style={{ fontSize: 12, color: "var(--text-secondary)", margin: "0 0 12px" }}>actual vs. goal</p>
                <div style={{ width: "100%", height: 10, background: "var(--surface-2)", borderRadius: 6, overflow: "hidden" }}>
                  <div style={{ width: Math.min(100, (getCurrentWeekVA(planVsActualByWeek).actual / getCurrentWeekVA(planVsActualByWeek).planned) * 100) + "%", height: "100%", background: ACTUAL_COLOR }} />
                </div>
                <button onClick={() => { setSelectedWeek(getDefaultWeekStart()); setTab("weekly"); }} style={{ marginTop: 14, fontSize: 13, color: "var(--text-primary)", background: "var(--surface-2)", border: "none", borderRadius: 8, padding: "8px 12px", cursor: "pointer", fontWeight: 500 }}>
                  View weekly breakdown &rarr;
                </button>
              </div>
            </div>
          </div>

          <div style={{ background: "var(--surface-1)", border: "1px solid var(--border)", borderRadius: 16, padding: "1rem 1.2rem", marginBottom: 16 }}>
            <p style={{ fontSize: 13, fontWeight: 500, color: "var(--text-secondary)", margin: "0 0 8px" }}>Mileage trend</p>
            <MileageTrendChart data={planVsActualByWeek} />
          </div>

          <div style={{ display: "flex", gap: 6, flexWrap: "wrap", marginBottom: 10 }}>
            {runTypes.map((t) => (
              <button
                key={t}
                onClick={() => setRunFilter(t)}
                style={{
                  fontSize: 12, padding: "5px 12px", borderRadius: 20, cursor: "pointer",
                  border: runFilter === t ? "1px solid var(--text-primary)" : "0.5px solid var(--border)",
                  background: runFilter === t ? "var(--text-primary)" : "var(--surface-2)",
                  color: runFilter === t ? "var(--surface-1)" : "var(--text-secondary)",
                  fontWeight: runFilter === t ? 500 : 400,
                }}
              >
                {displayWorkoutType(t)}
              </button>
            ))}
          </div>
          <div style={{ display: "flex", gap: 10, alignItems: "center", flexWrap: "wrap", marginBottom: 14 }}>
            <label style={{ fontSize: 12, color: "var(--text-secondary)", display: "flex", alignItems: "center", gap: 6 }}>
              From
              <input type="date" value={dateFrom} onChange={(e) => setDateFrom(e.target.value)} style={{ fontSize: 12, padding: "5px 8px", borderRadius: 6, border: "0.5px solid var(--border)", background: "var(--surface-2)", color: "var(--text-primary)" }} />
            </label>
            <label style={{ fontSize: 12, color: "var(--text-secondary)", display: "flex", alignItems: "center", gap: 6 }}>
              To
              <input type="date" value={dateTo} onChange={(e) => setDateTo(e.target.value)} style={{ fontSize: 12, padding: "5px 8px", borderRadius: 6, border: "0.5px solid var(--border)", background: "var(--surface-2)", color: "var(--text-primary)" }} />
            </label>
            {(dateFrom || dateTo) && (
              <button onClick={() => { setDateFrom(""); setDateTo(""); }} style={{ fontSize: 12, color: "var(--text-secondary)", background: "none", border: "none", cursor: "pointer", textDecoration: "underline" }}>
                Clear dates
              </button>
            )}
          </div>
          <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
            {RUNS.filter((r) => (runFilter === "All" || r.type === runFilter) && (!dateFrom || r.date >= dateFrom) && (!dateTo || r.date <= dateTo)).slice().reverse().map((r) => {
              const c = TYPE_COLOR[r.type] || TYPE_COLOR.Easy;
              return (
                <button key={r.date} onClick={() => { setModalExpanded(false); setActiveRunDate(r.date); }} style={{ display: "flex", alignItems: "center", justifyContent: "space-between", background: "var(--surface-2)", border: "0.5px solid var(--border)", borderRadius: 12, padding: "12px 16px", cursor: "pointer", textAlign: "left" }}>
                  <div style={{ display: "flex", alignItems: "center", gap: 12 }}>
                    <span style={{ background: c.solid, color: "#3D3428", fontSize: 12, padding: "4px 10px", borderRadius: 8, fontWeight: 500 }}>{displayWorkoutType(r.type)}</span>
                    <div>
                      <p style={{ margin: 0, fontSize: 14, fontWeight: 500 }}>{fmtDate(r.date)}</p>
                      <p style={{ margin: 0, fontSize: 13, color: "var(--text-secondary)" }}>{r.distance_mi} mi &middot; {fmtDuration(r.duration_s)} &middot; {fmtPace(r.duration_s / r.distance_mi)}/mi</p>
                    </div>
                  </div>
                  <div style={{ textAlign: "right" }}>
                    <p style={{ margin: 0, fontSize: 14, fontWeight: 500 }}>{r.avg_hr} bpm avg</p>
                    <p style={{ margin: 0, fontSize: 13, color: "var(--text-secondary)" }}>{cToF(r.avg_temp_c)}°F</p>
                  </div>
                </button>
              );
            })}
            {RUNS.filter((r) => (runFilter === "All" || r.type === runFilter) && (!dateFrom || r.date >= dateFrom) && (!dateTo || r.date <= dateTo)).length === 0 && (
              <p style={{ fontSize: 13, color: "var(--text-secondary)", margin: 0 }}>No runs match this filter.</p>
            )}
          </div>
        </div>
      )}

      {activeRunDate && runForDate(activeRunDate) && (
        <div
          onClick={() => setActiveRunDate(null)}
          style={{ position: "fixed", inset: 0, background: "rgba(30,26,20,0.4)", display: "flex", alignItems: "flex-start", justifyContent: "center", padding: "24px 16px", overflowY: "auto", zIndex: 1000 }}
        >
          <div onClick={(e) => e.stopPropagation()} style={{ maxWidth: 640, width: "100%", position: "relative" }}>
            <button
              onClick={() => setActiveRunDate(null)}
              style={{ position: "absolute", top: -12, right: -12, width: 32, height: 32, borderRadius: "50%", background: "var(--surface-2)", border: "0.5px solid var(--border)", cursor: "pointer", display: "flex", alignItems: "center", justifyContent: "center", zIndex: 1 }}
            >
              <i className="ti ti-x" style={{ fontSize: 16 }}></i>
            </button>
            <RunDetailCard
              r={runForDate(activeRunDate)}
              expanded={modalExpanded}
              onToggleExpand={() => setModalExpanded((v) => !v)}
            />
          </div>
        </div>
      )}

      {tab === "splits" && (
        <div style={{ display: "flex", flexDirection: "column", gap: 14 }}>
          {(runFilter === "All" ? RUNS : RUNS.filter((r) => r.type === runFilter)).slice().reverse().map((r) => (
            <RunDetailCard key={r.date} r={r} expanded={!!expanded[r.date]} onToggleExpand={() => setExpanded((e) => ({ ...e, [r.date]: !e[r.date] }))} />
          ))}
        </div>
      )}

      {tab === "weekly" && (
        <div>
          <div style={{ marginBottom: 16 }}>
            <select value={selectedWeek} onChange={(e) => setSelectedWeek(e.target.value)} style={{ width: "100%", maxWidth: 320 }}>
              {PLAN.map((w) => (<option key={w.weekStart} value={w.weekStart}>{w.weekLabel} ({fmtWeekRange(w.weekStart)})</option>))}
            </select>
          </div>

          <div className="rd-schedule-scroll" style={{ overflowX: "hidden", marginBottom: 24, background: "var(--surface-1)", border: "1px solid var(--border)", borderRadius: 16, padding: "0.8rem" }}>
            <table className="rd-schedule-table" style={{ width: "100%", tableLayout: "fixed", borderCollapse: "collapse", fontSize: 12 }}>
              <colgroup>
                <col style={{ width: "9%" }} />
                <col style={{ width: "9%" }} />
                <col style={{ width: "13%" }} />
                <col style={{ width: "7%" }} />
                <col style={{ width: "7%" }} />
                <col style={{ width: "7%" }} />
                <col style={{ width: "7%" }} />
                <col style={{ width: "7%" }} />
                <col style={{ width: "7%" }} />
                <col style={{ width: "27%" }} />
              </colgroup>
              <thead>
                <tr style={{ borderBottom: "0.5px solid var(--border)", background: "rgba(237,204,139,0.18)" }}>
                  <th style={{ textAlign: "center", padding: "8px 10px", color: "var(--text-secondary)", fontWeight: 500 }}>Day</th>
                  <th style={{ textAlign: "center", padding: "8px 10px", color: "var(--text-secondary)", fontWeight: 500 }}>Run</th>
                  <th style={{ textAlign: "center", padding: "8px 10px", color: "var(--text-secondary)", fontWeight: 500 }}>Workout</th>
                  <th style={{ textAlign: "center", padding: "8px 6px", color: "var(--text-secondary)", fontWeight: 500, background: "rgba(237,204,139,0.30)" }}>Goal<br />Mi</th>
                  <th style={{ textAlign: "center", padding: "8px 6px", color: "var(--text-secondary)", fontWeight: 500, background: "rgba(182,205,226,0.45)" }}>Actual<br />Mi</th>
                  <th style={{ textAlign: "center", padding: "8px 6px", color: "var(--text-secondary)", fontWeight: 500, background: "rgba(237,204,139,0.30)" }}>Goal<br />Pace</th>
                  <th style={{ textAlign: "center", padding: "8px 6px", color: "var(--text-secondary)", fontWeight: 500, background: "rgba(182,205,226,0.45)" }}>Actual<br />Pace</th>
                  <th style={{ textAlign: "center", padding: "8px 10px", color: "var(--text-secondary)", fontWeight: 500 }}>HR</th>
                  <th style={{ textAlign: "center", padding: "8px 10px", color: "var(--text-secondary)", fontWeight: 500 }}>°F</th>
                  <th style={{ textAlign: "left", padding: "8px 10px", color: "var(--text-secondary)", fontWeight: 500 }}>Notes</th>
                </tr>
              </thead>
              <tbody>
                {week.days.map((d) => {
                  const r = runForDate(d.date);
                  const workoutDisplay = getScheduleWorkoutDisplay(d.planned);
                  const workoutDetails = splitWorkoutDetail(workoutDisplay.detail);
                  const plannedMi = d.planned ? d.planned.distance : null;
                  const actualMi = r ? r.distance_mi : null;
                  const actualPace = r ? fmtPace(r.duration_s / r.distance_mi) : "\u2014";
                  const dayLetter = { Mon: "M", Tue: "T", Wed: "W", Thu: "T", Fri: "F", Sat: "S", Sun: "S" }[d.day] || d.day;
                  let deltaColor = "var(--text-secondary)";
                  if (plannedMi != null && actualMi != null) deltaColor = Math.abs(actualMi - plannedMi) < 0.3 ? "#666C64" : "#795E4F";
                  return (
                    <tr key={d.date} style={{ borderBottom: "0.5px solid var(--border)" }}>
                      <td
                        onClick={r ? () => { setModalExpanded(false); setActiveRunDate(d.date); } : undefined}
                        title={r ? "Open run details" : ""}
                        style={{ padding: "8px 10px", whiteSpace: "nowrap", textAlign: "center", cursor: r ? "pointer" : "default" }}
                      ><div style={{ fontWeight: 700 }}>{dayLetter}</div><div>{fmtDateShort(d.date)}</div></td>
                      <td style={{ padding: "8px 10px", textAlign: "center", whiteSpace: "nowrap" }}>{workoutDisplay.main}</td>
                      <td style={{ padding: "8px 10px", textAlign: "center", fontSize: 11, color: "var(--text-secondary)", overflowWrap: "anywhere" }}>
                        {workoutDetails.warmupCooldown || workoutDetails.intervals ? (
                          <React.Fragment>
                            {workoutDetails.warmupCooldown && <div>{workoutDetails.warmupCooldown}</div>}
                            {workoutDetails.intervals && <div style={{ marginTop: workoutDetails.warmupCooldown ? 2 : 0 }}>{workoutDetails.intervals}</div>}
                          </React.Fragment>
                        ) : "—"}
                      </td>
                      <td style={{ padding: "8px 2px", textAlign: "center", background: PLANNED_COLOR + "33" }}>{plannedMi != null ? plannedMi : "—"}</td>
                      <td style={{ padding: "8px 2px", textAlign: "center", color: deltaColor, fontWeight: 500, background: ACTUAL_COLOR + "55" }}>{actualMi != null ? actualMi : "—"}</td>
                      <td style={{ padding: "8px 2px", textAlign: "center", background: PLANNED_COLOR + "33" }}>{d.planned && d.planned.paceTarget ? (() => { const parts = d.planned.paceTarget.split(/[–-]/); return parts.length > 1 ? <span>{parts[0]}–<br />{parts.slice(1).join("–")}</span> : d.planned.paceTarget; })() : "—"}</td>
                      <td style={{ padding: "8px 2px", textAlign: "center", whiteSpace: "nowrap", background: ACTUAL_COLOR + "55" }}>{actualPace}</td>
                      <td style={{ padding: "8px 2px", textAlign: "center", whiteSpace: "nowrap" }}>{r ? r.avg_hr : "—"}</td>
                      <td style={{ padding: "8px 2px", textAlign: "center", whiteSpace: "nowrap" }}>{r && r.avg_temp_c != null ? cToF(r.avg_temp_c) : "—"}</td>
                      <td style={{ padding: "8px 10px", fontSize: 12, color: "var(--text-secondary)", textAlign: "left" }}>{d.note || "—"}</td>
                    </tr>
                  );
                })}
              </tbody>
            </table>
          </div>

          <div style={{ background: "var(--surface-1)", border: "1px solid var(--border)", borderRadius: 16, padding: "1rem 1.2rem" }}>
            <p style={{ fontSize: 13, color: "var(--text-secondary)", margin: "0 0 8px" }}>Mileage trend</p>
            <MileageTrendChart data={planVsActualByWeek} height={220} />
            <p style={{ fontSize: 12, color: "var(--text-secondary)", margin: "8px 0 0" }}>This chart will get more useful for week-over-week comparison as more weeks are logged.</p>
          </div>
        </div>
      )}

      {tab === "trends" && (
        <div style={{ display: "flex", flexDirection: "column", gap: 16 }}>
          <p style={{ fontSize: 12, color: "var(--text-secondary)", margin: 0 }}>
            Pace and heart rate over time, by run type. For hills, this uses only the detected climb-repeat segments &mdash; not the recovery jogs between them &mdash; so it's not diluted by the easy portions.
          </p>
          {Object.entries(trendsByType).map(([type, points]) => {
            const c = TYPE_COLOR[type] || TYPE_COLOR.Easy;
            const trendPaceScale = niceScale(points.map((p) => p.pace == null ? null : -p.pace), 30);
            const trendDistanceScale = niceScale(points.map((p) => p.distance), 1, true);
            const repLengthScale = niceScale(points.map((p) => p.repLength), 0.05, true);
            const repElevScale = niceScale(points.map((p) => p.repElev), 10, true);
            return (
              <div key={type} style={{ background: "var(--surface-1)", border: "1px solid var(--border)", borderRadius: 16, padding: "1rem 1.2rem" }}>
                <div style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 10 }}>
                  <span style={{ background: c.solid, color: "#3D3428", fontSize: 12, padding: "3px 9px", borderRadius: 8, fontWeight: 500 }}>{displayWorkoutType(type)}</span>
                  <p style={{ margin: 0, fontSize: 12, color: "var(--text-secondary)" }}>{points.length} run{points.length !== 1 ? "s" : ""} logged</p>
                </div>
                {type === "Hill" && (
                  <p style={{ fontSize: 11, color: "var(--text-secondary)", margin: "0 0 10px" }}>Based on the individual hill-repeat laps (not the recovery jogs between them).</p>
                )}
                {points.length < 2 ? (
                  <p style={{ fontSize: 12, color: "var(--text-secondary)", margin: 0 }}>
                    Need at least 2 runs of this type to show a trend. So far: {fmtPace(points[0].pace)}/mi at {points[0].hr} bpm on {fmtDate(points[0].date)}
                    {points[0].repLength ? ` (avg rep: ${points[0].repLength} mi, ${Math.round(points[0].repTime)}s, ${points[0].repElev} ft gain, ${points[0].repCount} reps)` : ""}.
                  </p>
                ) : (
                  <React.Fragment>
                    <p style={{ fontSize: 11, color: "var(--text-secondary)", margin: "0 0 4px" }}>Pace, mileage &amp; HR</p>
                    <div style={{ height: 150, marginBottom: type === "Hill" ? 14 : 0 }}>
                      <ResponsiveContainer width="100%" height="100%">
                        <ComposedChart data={points.map((p) => ({ ...p, paceNeg: p.pace != null ? -p.pace : null }))} margin={{ top: 4, right: 8, left: 0, bottom: 0 }}>
                          <CartesianGrid strokeDasharray="3 3" stroke="var(--border)" vertical={false} />
                          <XAxis dataKey="dateLabel" tick={{ fontSize: 11, fill: "var(--text-secondary)" }} axisLine={{ stroke: "var(--border)" }} tickLine={false} />
                          <YAxis yAxisId="pace" tickFormatter={(v) => fmtPace(-v)} tick={{ fontSize: 11, fill: "var(--text-secondary)" }} axisLine={false} tickLine={false} width={42} domain={trendPaceScale.domain} ticks={trendPaceScale.ticks} interval={0} />
                          <YAxis yAxisId="distance" orientation="right" domain={trendDistanceScale.domain} ticks={trendDistanceScale.ticks} interval={0} tick={{ fontSize: 11, fill: "var(--text-secondary)" }} axisLine={false} tickLine={false} width={34} />
                          <YAxis yAxisId="hr" hide domain={[100, 200]} />
                          <Tooltip
                            contentStyle={{ background: "var(--surface-2)", border: "0.5px solid var(--border)", borderRadius: 8, fontSize: 12 }}
                            formatter={(value, name, item) => {
                              const key = item && item.dataKey;
                              if (key === "paceNeg") return [fmtPace(-value) + "/mi", "Pace"];
                              if (key === "distance") return [value + " mi", "Mileage"];
                              if (key === "hr") return [value + " bpm", "HR"];
                              return [value, name];
                            }}
                          />
                          <Legend wrapperStyle={{ fontSize: 11 }} />
                          <Bar name="Mileage" yAxisId="distance" dataKey="distance" fill={ACTUAL_COLOR} radius={[3, 3, 0, 0]} barSize={18} />
                          <Line name="Pace" yAxisId="pace" type="monotone" dataKey="paceNeg" stroke={c.solid} strokeWidth={2} dot={{ r: 4 }} />
                          <Line name="HR" yAxisId="hr" type="monotone" dataKey="hr" stroke="#A26360" strokeWidth={2} strokeDasharray="4 3" dot={{ r: 4 }} />
                        </ComposedChart>
                      </ResponsiveContainer>
                    </div>
                    {type === "Hill" && (
                      <React.Fragment>
                        <p style={{ fontSize: 11, color: "var(--text-secondary)", margin: "0 0 4px" }}>Avg rep length &amp; elevation gain</p>
                        <div style={{ height: 150 }}>
                          <ResponsiveContainer width="100%" height="100%">
                            <ComposedChart data={points} margin={{ top: 4, right: 8, left: 0, bottom: 0 }}>
                              <CartesianGrid strokeDasharray="3 3" stroke="var(--border)" vertical={false} />
                              <XAxis dataKey="dateLabel" tick={{ fontSize: 11, fill: "var(--text-secondary)" }} axisLine={{ stroke: "var(--border)" }} tickLine={false} />
                              <YAxis yAxisId="len" domain={repLengthScale.domain} ticks={repLengthScale.ticks} interval={0} tick={{ fontSize: 11, fill: "var(--text-secondary)" }} axisLine={false} tickLine={false} width={42} />
                              <YAxis yAxisId="elev" orientation="right" domain={repElevScale.domain} ticks={repElevScale.ticks} interval={0} tick={{ fontSize: 11, fill: "var(--text-secondary)" }} axisLine={false} tickLine={false} width={34} />
                              <Tooltip
                                contentStyle={{ background: "var(--surface-2)", border: "0.5px solid var(--border)", borderRadius: 8, fontSize: 12 }}
                                formatter={(value, name, item) => item && item.dataKey === "repLength" ? [value + " mi", "Avg rep length"] : [value + " ft", "Avg rep elevation gain"]}
                              />
                              <Legend wrapperStyle={{ fontSize: 11 }} />
                              <Line name="Avg rep length" yAxisId="len" type="monotone" dataKey="repLength" stroke="#EDCC8B" strokeWidth={2} dot={{ r: 4 }} />
                              <Line name="Avg rep elevation gain" yAxisId="elev" type="monotone" dataKey="repElev" stroke="#BDD1C5" strokeWidth={2} strokeDasharray="4 3" dot={{ r: 4 }} />
                            </ComposedChart>
                          </ResponsiveContainer>
                        </div>
                      </React.Fragment>
                    )}
                  </React.Fragment>
                )}
              </div>
            );
          })}
        </div>
      )}

      {tab === "gear" && (
        <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>
          {shoeMileage.map((s) => {
            const pct = Math.min(100, (s.miles / s.maxMiles) * 100);
            return (
              <div key={s.shoe} style={{ background: "var(--surface-1)", border: "1px solid var(--border)", borderRadius: 16, padding: "1rem 1.2rem" }}>
                <div style={{ display: "flex", justifyContent: "space-between", alignItems: "baseline", marginBottom: 6 }}>
                  <p style={{ margin: 0, fontSize: 14, fontWeight: 500 }}>{s.shoe}</p>
                  <p style={{ margin: 0, fontSize: 12, color: "var(--text-secondary)" }}>{s.runs} run{s.runs !== 1 ? "s" : ""}</p>
                </div>
                <div style={{ width: "100%", height: 10, background: "var(--surface-2)", borderRadius: 6, overflow: "hidden", marginBottom: 4 }}>
                  <div style={{ width: pct + "%", height: "100%", background: pct > 90 ? "#A26360" : "#BDD1C5" }} />
                </div>
                <p style={{ margin: 0, fontSize: 12, color: "var(--text-secondary)" }}>{s.miles} of {s.maxMiles} mi</p>
              </div>
            );
          })}
        </div>
      )}
    </div>
  );
}


const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<RunningDashboard />);
</script>
</body>
</html>
